[project]
name = "c3sim"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["numpy", "scipy", "numba", "pandas", "matplotlib"]

[project.optional-dependencies]
test = ["pytest"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["c3sim", "experiments"]

[tool.pytest.ini_options]
testpaths = ["tests"]
